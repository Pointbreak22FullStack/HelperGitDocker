map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ─────────────────────────────────────────────
# LOCAL TESTING: localhost HTTP (no SSL required)
# ─────────────────────────────────────────────
server {
    listen 80;
    server_name localhost;

    location /hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto http;
    }

    location /identity/ {
        proxy_pass http://identity:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /connect/ {
        proxy_pass http://identity:8080;
        proxy_set_header Host $host;
    }

    location /.well-known/ {
        proxy_pass http://identity:8080;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://client:80;
        proxy_set_header Host $host;
    }
}

# ─────────────────────────────────────────────
# PRODUCTION: HTTP → HTTPS redirect
# ─────────────────────────────────────────────
server {
    listen 80;
    server_name webparser.com www.webparser.com api.webparser.com id.webparser.com;
    return 301 https://$host$request_uri;
}

# ─────────────────────────────────────────────
# PRODUCTION: Client (Angular SPA)
# ─────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name webparser.com www.webparser.com localhost;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://client:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ─────────────────────────────────────────────
# PRODUCTION: API (WebApi)
# ─────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name api.webparser.com;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location /hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_cache_bypass $http_upgrade;
    }

    location / {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# ─────────────────────────────────────────────
# PRODUCTION: Identity (OpenIddict)
# ─────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name id.webparser.com;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://identity:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
