name: HelperGitDocker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore HelperGitDocker.csproj
        working-directory: ./HelperGitDocker

      - name: Build HelperGitDocker
        run: dotnet build --configuration Release HelperGitDocker.csproj
        working-directory: ./HelperGitDocker

      - name: Validate Docker Compose
        run: |
          cd HelperGitDocker
          docker compose config
