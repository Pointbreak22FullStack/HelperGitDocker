name: HelperGitDocker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore HelperGitDocker.csproj

      - name: Build HelperGitDocker
        run: dotnet build --configuration Release --no-restore HelperGitDocker.csproj

      - name: Validate Docker Compose
        env:
          # Фиктивные значения только для проверки синтаксиса compose
          POSTGRES_PASSWORD: ci-dummy
          ENCRYPTION_KEY: Y2ktZHVtbXkta2V5LWNpLWR1bW15LWtleS0wMDAwMDA=
        run: docker compose config --quiet
